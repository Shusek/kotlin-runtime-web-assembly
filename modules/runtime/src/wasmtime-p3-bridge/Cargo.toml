[package]
name = "krwa-wasmtime-p3-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
bytes = { version = "1.11.1", default-features = false }
http = "1.3.1"
http-body-util = "0.1.3"
tokio = { version = "1.52.3", features = ["net", "rt", "time"] }
wasmtime = { path = "../../build/wasmtime-pulley/source/crates/wasmtime", default-features = false, features = [
    "component-model-async",
    "gc",
    "gc-drc",
    "gc-null",
    "pulley",
    "runtime",
] }
wasmtime-wasi = { path = "../../build/wasmtime-pulley/source/crates/wasi", default-features = false, features = ["p3"] }
wasmtime-wasi-http = { path = "../../build/wasmtime-pulley/source/crates/wasi-http", default-features = false, features = ["default-send-request", "p3"] }
