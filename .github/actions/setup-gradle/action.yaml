name: Set up KRWA Gradle
description: Sets up the pinned Java runtime and the shared Gradle build cache.

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 25

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        # Gradle defaults feature branches to read-only caching. Internal PRs are
        # trusted to populate their branch-scoped task cache; forked PRs remain
        # read-only so untrusted builds cannot publish cache entries.
        cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
