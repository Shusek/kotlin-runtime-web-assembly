name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify; defaults to the triggering commit.
        required: false
        type: string
        default: ""
      artifact-retention-days:
        description: Retention for intermediate Maven repository shards.
        required: false
        type: number
        default: 1
      export-verified-repository:
        description: Upload the merged verified Maven repository for a caller.
        required: false
        type: boolean
        default: false
      run-docs:
        description: Build documentation alongside platform gates.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  jvm:
    name: JVM
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Gradle
        uses: ./.github/actions/setup-gradle

      - name: Install pinned Wasmtime and wasm-tools
        run: bash .github/scripts/install_wasm_host_tools.sh

      - name: Test build logic
        run: >-
          ./gradlew -p buildSrc --no-daemon --max-workers=4
          -Pkotlin.compiler.execution.strategy=in-process test
        env:
          GRADLE_OPTS: "-ea"

      - name: Run JVM and host-native gate
        run: >-
          ./gradlew --no-daemon --max-workers=4
          -Pkotlin.compiler.execution.strategy=in-process
          ciJvmGate --stacktrace
        env:
          GRADLE_OPTS: "-ea"

      - name: Upload JVM test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports
          path: "**/build/reports/tests"
          retention-days: 7
          if-no-files-found: ignore

  runtime-spec:
    name: Wasm runtime spec (${{ matrix.label }})
    runs-on: ubuntu-latest
    # The first shard contains the largest indivisible spec class and builds the
    # Wasmtime-backed runtime from a cold cache. Give only that shard extra headroom.
    timeout-minutes: ${{ matrix.shard == 0 && 35 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            label: 1/8
          - shard: 1
            label: 2/8
          - shard: 2
            label: 3/8
          - shard: 3
            label: 4/8
          - shard: 4
            label: 5/8
          - shard: 5
            label: 6/8
          - shard: 6
            label: 7/8
          - shard: 7
            label: 8/8

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Gradle
        uses: ./.github/actions/setup-gradle

      - name: Install pinned Wasmtime and wasm-tools
        run: bash .github/scripts/install_wasm_host_tools.sh

      - name: Run exhaustive Wasm runtime specification-test shard
        run: >-
          ./gradlew --no-daemon --max-workers=4
          -Pkotlin.compiler.execution.strategy=in-process
          -Pkrwa.runtimeTests.maxParallelForks=3
          -Pkrwa.runtimeTests.shard=${{ matrix.shard }}/8
          ciRuntimeSpecGate --stacktrace
        env:
          GRADLE_OPTS: "-ea"

      - name: Upload runtime specification-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-spec-test-reports-${{ matrix.shard }}
          path: testing/runtime-tests/build/reports/tests
          retention-days: 7
          if-no-files-found: ignore

  host-native:
    name: Host native bridge
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Gradle
        uses: ./.github/actions/setup-gradle

      - name: Set up host native toolchain
        uses: ./.github/actions/setup-native
        with:
          platform: host

      - name: Install pinned Wasmtime and wasm-tools
        run: bash .github/scripts/install_wasm_host_tools.sh

      - name: Test host-native bridge
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          -Pkrwa.native.platform=host
          ciHostNativeGate --stacktrace
        env:
          GRADLE_OPTS: "-ea"

  web-publications:
    name: Wasm and JVM publications
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Gradle
        uses: ./.github/actions/setup-gradle

      - name: Test Wasm and stage non-native publications
        run: >-
          ./gradlew --no-daemon --max-workers=1
          -Pkotlin.compiler.execution.strategy=in-process
          ciWebPublicationGate --stacktrace
        env:
          GRADLE_OPTS: "-ea"

      - name: Upload JVM and Wasm Maven shard
        uses: actions/upload-artifact@v7
        with:
          name: release-jvm-web
          path: build/release-staging-repository
          retention-days: ${{ inputs.artifact-retention-days || 1 }}
          compression-level: 0
          if-no-files-found: error

  android:
    name: Android
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Gradle
        uses: ./.github/actions/setup-gradle

      - name: Set up Android native toolchain
        uses: ./.github/actions/setup-native
        with:
          platform: android

      - name: Test Android and stage Android publications
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          -Pkrwa.native.platform=android
          ciAndroidGate --stacktrace
        env:
          GRADLE_OPTS: "-ea"

      - name: Inspect Android runtime artifact
        run: |
          set -euo pipefail
          aar=modules/runtime-wasmtime-android/build/outputs/aar/runtime-wasmtime-android.aar
          unzip -p "$aar" proguard.txt | grep -F AndroidWasmtimePulleyNative
          classes_jar="$RUNNER_TEMP/runtime-wasmtime-android-classes.jar"
          unzip -p "$aar" classes.jar > "$classes_jar"
          unzip -l "$classes_jar" | grep -F META-INF/LICENSE-WASMTIME
          unzip -l "$classes_jar" | grep -F META-INF/THIRD-PARTY.txt
          for abi in arm64-v8a armeabi-v7a; do
            for library in \
              libwasmtime.so \
              libkrwa_pulley_android.so \
              libkrwa_wasmtime_p3_bridge.so \
              libkrwa_wasmtime_p3_android.so; do
              unzip -l "$aar" | grep -F "jni/$abi/$library"
            done
          done

      - name: Upload Android Maven shard
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: build/release-staging-repository
          retention-days: ${{ inputs.artifact-retention-days || 1 }}
          compression-level: 0
          if-no-files-found: error

  ios:
    name: iOS device and simulator
    if: ${{ github.event_name != 'push' }}
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Gradle
        uses: ./.github/actions/setup-gradle

      - name: Set up iOS native toolchain
        uses: ./.github/actions/setup-native
        with:
          platform: ios

      - name: Create compatible iOS simulator
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes | awk '/^iOS / && $0 !~ /unavailable/ { value=$NF } END { gsub(/[()]/, "", value); print value }')"
          device_id=""
          while IFS= read -r device_type; do
            if device_id="$(xcrun simctl create 'KRWA CI' "$device_type" "$runtime" 2>/dev/null)"; then
              break
            fi
          done < <(xcrun simctl list devicetypes | awk '/^iPhone / { value=$NF; gsub(/[()]/, "", value); print value }')
          test -n "$device_id"
          echo "KRWA_TEST_SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"

      - name: Test iOS and stage iOS publications
        run: >-
          ./gradlew --no-daemon --max-workers=1
          -Pkotlin.compiler.execution.strategy=in-process
          -Pkrwa.native.platform=ios
          -Pkrwa.appleToolchainIdentity="$KRWA_APPLE_TOOLCHAIN_IDENTITY"
          ciIosGate --stacktrace
        env:
          GRADLE_OPTS: "-ea"

      - name: Upload iOS Maven shard
        uses: actions/upload-artifact@v7
        with:
          name: release-ios
          path: build/release-staging-repository
          retention-days: ${{ inputs.artifact-retention-days || 1 }}
          compression-level: 0
          if-no-files-found: error

      - name: Delete test simulator
        if: always()
        run: |
          if [ -n "${KRWA_TEST_SIMULATOR_ID:-}" ]; then
            xcrun simctl delete "$KRWA_TEST_SIMULATOR_ID" || true
          fi

  repository:
    name: Merged repository and consumers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [web-publications, android, ios]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: ./.github/actions/setup-gradle

      - name: Download JVM and Wasm Maven shard
        uses: actions/download-artifact@v8
        with:
          name: release-jvm-web
          path: build/repository-shards/jvm-web

      - name: Download Android Maven shard
        uses: actions/download-artifact@v8
        with:
          name: release-android
          path: build/repository-shards/android

      - name: Download iOS Maven shard
        uses: actions/download-artifact@v8
        with:
          name: release-ios
          path: build/repository-shards/ios

      - name: Merge Maven repository shards
        run: >-
          python .github/scripts/merge_maven_repositories.py
          --output build/release-staging-repository
          build/repository-shards/jvm-web
          build/repository-shards/android
          build/repository-shards/ios

      - name: Prepare sample consumer dependencies
        run: >-
          ./gradlew --no-daemon --max-workers=4
          -Pkotlin.compiler.execution.strategy=in-process
          prepareMergedStandaloneSampleReleaseDependencies
          prepareMergedAndroidSampleReleaseDependencies
          prepareReleasePomDescriptorDependencies
        env:
          GRADLE_OPTS: "-ea"

      - name: Verify merged repository and consumers offline
        run: >-
          ./gradlew --no-daemon --offline --max-workers=4
          -Pkotlin.compiler.execution.strategy=in-process
          -Pkrwa.release.verifyOnly=true
          verifyMergedReleaseRepository --stacktrace
        env:
          GRADLE_OPTS: "-ea"

      - name: Export verified Maven repository
        if: ${{ inputs.export-verified-repository }}
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-repository
          path: build/release-staging-repository
          retention-days: ${{ inputs.artifact-retention-days || 1 }}
          compression-level: 0
          if-no-files-found: error

  docs:
    name: Documentation
    if: ${{ github.event_name != 'push' && (inputs.run-docs || inputs.ref == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Zensical
        run: python -m pip install -r docs/requirements.txt

      - name: Test Maven Central release tooling
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Set up Gradle
        uses: ./.github/actions/setup-gradle

      - name: Build Zensical docs
        run: zensical build --clean

      - name: Build Dokka API docs
        run: ./gradlew --no-daemon --max-workers=4 :dokkaGenerate
