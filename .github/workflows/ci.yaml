name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  gradle-tests:
    name: Gradle Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Checkout WebAssembly testsuite
        uses: actions/checkout@v6
        with:
          repository: WebAssembly/testsuite
          path: build/external-testsuites/wasm
          ref: 88e97b0f742f4c3ee01fea683da130f344dd7b02

      - name: Checkout WASI testsuite
        uses: actions/checkout@v6
        with:
          repository: WebAssembly/wasi-testsuite
          path: build/external-testsuites/wasi
          ref: prod/testsuite-base

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Component Model Gradle plugin
        run: ./gradlew --no-daemon :component-model-gradle-plugin:test :component-model-gradle-plugin:validatePlugins
        env:
          GRADLE_OPTS: "-ea"

      - name: Run tests
        run: ./gradlew --no-daemon test --continue
        env:
          GRADLE_OPTS: "-ea"

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Zensical
        run: python -m pip install -r docs/requirements.txt

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Zensical docs
        run: zensical build --clean

      - name: Build Dokka API docs
        run: ./gradlew --no-daemon :dokkaGenerate
