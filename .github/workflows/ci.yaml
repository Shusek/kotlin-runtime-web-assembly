name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  gradle-tests:
    name: Release Gate
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Install Wasmtime C API
        run: |
          set -euo pipefail
          version="$(grep '^wasmtime = ' gradle/libs.versions.toml | cut -d '"' -f 2)"
          case "$(uname -m)" in
            arm64)
              target="aarch64-macos"
              api_sha256="c013fe243fd6e13cd63f13dcfa88c3aff5664e356181a2e1bda2c3bf8381fde0"
              cli_sha256="06d53af42ef3cbef5c7d44c14a6693b3456ac3d9df00950fb202075e27314f3e"
              ;;
            x86_64)
              target="x86_64-macos"
              api_sha256="5910124fafa760b8dc3444aae034ba224a7454fe1bb7855d1bed5fc118941588"
              cli_sha256="548b37f774d55e845f1d0407d9d9bbba8799cbabe45d617d5d0127706badd08b"
              ;;
            *) echo "Unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          api_archive="$RUNNER_TEMP/wasmtime-c-api.tar.xz"
          cli_archive="$RUNNER_TEMP/wasmtime-cli.tar.xz"
          root="$RUNNER_TEMP/wasmtime-c-api"
          curl --fail --location --output "$api_archive" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v${version}/wasmtime-v${version}-${target}-c-api.tar.xz"
          curl --fail --location --output "$cli_archive" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v${version}/wasmtime-v${version}-${target}.tar.xz"
          test "$(shasum -a 256 "$api_archive" | cut -d ' ' -f 1)" = "$api_sha256"
          test "$(shasum -a 256 "$cli_archive" | cut -d ' ' -f 1)" = "$cli_sha256"
          mkdir -p "$root"
          tar -xJf "$api_archive" -C "$root"
          tar -xJf "$cli_archive" -C "$root"
          library="$root/wasmtime-v${version}-${target}-c-api/lib/libwasmtime.dylib"
          executable="$root/wasmtime-v${version}-${target}/wasmtime"
          test -f "$library"
          test -x "$executable"
          echo "KRWA_WASMTIME_LIBRARY=$library" >> "$GITHUB_ENV"
          echo "WASMTIME=$executable" >> "$GITHUB_ENV"
          dirname "$executable" >> "$GITHUB_PATH"

      - name: Install wasm-tools CLI
        run: |
          set -euo pipefail
          version="$(grep '^wasmTools = ' gradle/libs.versions.toml | cut -d '"' -f 2)"
          case "$(uname -m)" in
            arm64)
              target="aarch64-macos"
              archive_sha256="c4c0f8560d996e47313aadf8df745e4d15eef38090e671384eafcb06d8d135fa"
              ;;
            x86_64)
              target="x86_64-macos"
              archive_sha256="108759377f47278ec598a994993bf10770d907dd935be5c436ca5cfc01bd008c"
              ;;
            *) echo "Unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/wasm-tools.tar.gz"
          root="$RUNNER_TEMP/wasm-tools"
          curl --fail --location --output "$archive" \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${version}/wasm-tools-${version}-${target}.tar.gz"
          test "$(shasum -a 256 "$archive" | cut -d ' ' -f 1)" = "$archive_sha256"
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root"
          executable="$root/wasm-tools-${version}-${target}/wasm-tools"
          test -x "$executable"
          echo "KRWA_WASM_TOOLS=$executable" >> "$GITHUB_ENV"
          dirname "$executable" >> "$GITHUB_PATH"

      - name: Install and verify pinned native toolchain
        run: |
          set -euo pipefail
          rust_version="$(sed -n 's/^rustRelease = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          rust_commit="$(sed -n 's/^rustReleaseCommit = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          test -n "$rust_version"
          test -n "$rust_commit"
          rustup --version
          rustup toolchain install "$rust_version" --profile minimal
          rustc_metadata="$(rustup run "$rust_version" rustc -vV)"
          test "$(printf '%s\n' "$rustc_metadata" | sed -n 's/^release: //p')" = "$rust_version"
          test "$(printf '%s\n' "$rustc_metadata" | sed -n 's/^commit-hash: //p')" = "$rust_commit"
          cargo "+$rust_version" --version
          cmake --version
          node --version
          xcrun --sdk iphonesimulator --find clang++

      - name: Create compatible iOS simulator
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes | awk '/^iOS / && $0 !~ /unavailable/ { value=$NF } END { gsub(/[()]/, "", value); print value }')"
          device_id=""
          while IFS= read -r device_type; do
            if device_id="$(xcrun simctl create 'KRWA CI' "$device_type" "$runtime" 2>/dev/null)"; then
              break
            fi
          done < <(xcrun simctl list devicetypes | awk '/^iPhone / { value=$NF; gsub(/[()]/, "", value); print value }')
          test -n "$device_id"
          echo "KRWA_TEST_SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"

      - name: Test build logic
        run: >-
          ./gradlew -p buildSrc --no-daemon --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process test
        env:
          GRADLE_OPTS: "-ea"

      - name: Prepare pinned release dependencies
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          prepareReleaseDependencies
        env:
          GRADLE_OPTS: "-ea"

      - name: Test component model Gradle plugin in isolation
        run: >-
          ./gradlew --no-daemon --offline --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          :component-model-gradle-plugin:test --stacktrace
        env:
          GRADLE_OPTS: "-ea"

      - name: Run complete release gate offline
        run: >-
          ./gradlew --no-daemon --offline --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process releaseGate
        env:
          GRADLE_OPTS: "-ea"

      - name: Inspect Android Wasmtime runtime artifact
        run: |
          set -euo pipefail
          aar=modules/runtime-wasmtime-android/build/outputs/aar/runtime-wasmtime-android.aar
          unzip -p "$aar" proguard.txt | grep -F AndroidWasmtimePulleyNative
          classes_jar="$RUNNER_TEMP/runtime-wasmtime-android-classes.jar"
          unzip -p "$aar" classes.jar > "$classes_jar"
          unzip -l "$classes_jar" | grep -F META-INF/LICENSE-WASMTIME
          unzip -l "$classes_jar" | grep -F META-INF/THIRD-PARTY.txt
          for abi in arm64-v8a armeabi-v7a; do
            for library in \
              libwasmtime.so \
              libkrwa_pulley_android.so \
              libkrwa_wasmtime_p3_bridge.so \
              libkrwa_wasmtime_p3_android.so; do
              unzip -l "$aar" | grep -F "jni/$abi/$library"
            done
          done

      - name: Delete test simulator
        if: always()
        run: |
          if [ -n "${KRWA_TEST_SIMULATOR_ID:-}" ]; then
            xcrun simctl delete "$KRWA_TEST_SIMULATOR_ID" || true
          fi

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Zensical
        run: python -m pip install -r docs/requirements.txt

      - name: Test Maven Central release tooling
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build Zensical docs
        run: zensical build --clean

      - name: Build Dokka API docs
        run: ./gradlew --no-daemon :dokkaGenerate
