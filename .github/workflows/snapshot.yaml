name: Snapshot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish-site:
    name: Build Pages And Non-iOS Snapshots
    runs-on: ubuntu-latest
    if: github.repository == 'Shusek/kotlin-runtime-web-assembly'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select immutable development version
        run: echo "KRWA_PUBLISH_VERSION=0.3.0-dev.${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Zensical
        run: python -m pip install -r docs/requirements.txt

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Zensical docs
        run: zensical build --clean

      - name: Build Dokka API docs
        run: ./gradlew --no-daemon :dokkaGenerate

      - name: Prepare Pages site
        run: |
          set -euo pipefail
          rm -rf build/pages
          mkdir -p build/pages/api
          rsync -a site/ build/pages/
          rsync -a build/dokka/html/ build/pages/api/
          touch build/pages/.nojekyll

      - name: Restore immutable development artifacts
        run: |
          set -euo pipefail
          if git fetch origin refs/heads/dev-maven:refs/remotes/origin/dev-maven; then
            mkdir -p build/pages/maven
            git archive refs/remotes/origin/dev-maven | tar -x -C build/pages/maven
          fi

      - name: Publish snapshot artifacts
        run: >-
          ./gradlew --no-daemon
          -Pversion="$KRWA_PUBLISH_VERSION"
          -Pkrwa.githubPagesMavenRepository="$PWD/build/pages/maven"
          verifyImmutablePublicationVersion
          publishAllPublicationsToGithubPagesRepository
          -x test

      - name: Upload Pages workspace
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-pages
          path: build/pages
          retention-days: 1
          if-no-files-found: error

  publish-ios:
    name: Publish iOS Snapshot Artifacts
    runs-on: macos-latest
    if: github.repository == 'Shusek/kotlin-runtime-web-assembly'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select immutable development version
        run: echo "KRWA_PUBLISH_VERSION=0.3.0-dev.${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install and verify pinned native toolchain
        run: |
          set -euo pipefail
          rust_version="$(sed -n 's/^rustRelease = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          rust_commit="$(sed -n 's/^rustReleaseCommit = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          test -n "$rust_version"
          test -n "$rust_commit"
          rustup --version
          rustup toolchain install "$rust_version" --profile minimal
          rustc_metadata="$(rustup run "$rust_version" rustc -vV)"
          test "$(printf '%s\n' "$rustc_metadata" | sed -n 's/^release: //p')" = "$rust_version"
          test "$(printf '%s\n' "$rustc_metadata" | sed -n 's/^commit-hash: //p')" = "$rust_commit"
          cargo "+$rust_version" --version
          cmake --version
          xcrun --sdk iphoneos --find clang++
          xcrun --sdk iphonesimulator --find clang++

      - name: Publish iOS snapshot artifacts
        run: |
          ./gradlew --no-daemon -Pkrwa.githubPagesMavenRepository="$PWD/build/ios-maven" \
            -Pversion="$KRWA_PUBLISH_VERSION" \
            verifyImmutablePublicationVersion \
            :annotations:annotations:publishIosArm64PublicationToGithubPagesRepository \
            :annotations:annotations:publishIosSimulatorArm64PublicationToGithubPagesRepository \
            :wasm:publishIosArm64PublicationToGithubPagesRepository \
            :wasm:publishIosSimulatorArm64PublicationToGithubPagesRepository \
            :wasi:publishIosArm64PublicationToGithubPagesRepository \
            :wasi:publishIosSimulatorArm64PublicationToGithubPagesRepository \
            :wasi-preview3:publishIosArm64PublicationToGithubPagesRepository \
            :wasi-preview3:publishIosSimulatorArm64PublicationToGithubPagesRepository \
            :component-model:publishIosArm64PublicationToGithubPagesRepository \
            :component-model:publishIosSimulatorArm64PublicationToGithubPagesRepository \
            :runtime:publishIosArm64PublicationToGithubPagesRepository \
            :runtime:publishIosSimulatorArm64PublicationToGithubPagesRepository \
            -x test

      - name: Upload iOS Maven artifacts
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-ios-maven
          path: build/ios-maven
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy Snapshot And Docs
    runs-on: ubuntu-latest
    needs: [publish-site, publish-ios]
    if: github.repository == 'Shusek/kotlin-runtime-web-assembly'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout workflow sources
        uses: actions/checkout@v7

      - name: Select immutable development version
        run: echo "KRWA_PUBLISH_VERSION=0.3.0-dev.${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Download Pages workspace
        uses: actions/download-artifact@v8
        with:
          name: snapshot-pages
          path: build/pages

      - name: Download iOS Maven artifacts
        uses: actions/download-artifact@v8
        with:
          name: snapshot-ios-maven
          path: build/ios-maven

      - name: Merge iOS Maven artifacts
        run: |
          rsync -a build/ios-maven/ build/pages/maven/
          touch build/pages/.nojekyll

      - name: Persist immutable development artifacts
        run: |
          set -euo pipefail
          storage="$RUNNER_TEMP/krwa-dev-maven"
          if git fetch origin refs/heads/dev-maven:refs/remotes/origin/dev-maven; then
            git worktree add --detach "$storage" refs/remotes/origin/dev-maven
          else
            git worktree add --detach "$storage"
            git -C "$storage" switch --orphan dev-maven
          fi
          rsync -a --delete --exclude=.git build/pages/maven/ "$storage"/
          touch "$storage/.nojekyll"
          git -C "$storage" config user.name github-actions[bot]
          git -C "$storage" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$storage" add --all
          if ! git -C "$storage" diff --cached --quiet; then
            git -C "$storage" commit -m "Publish $KRWA_PUBLISH_VERSION"
            git -C "$storage" push origin HEAD:refs/heads/dev-maven
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: build/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
