name: Publish Maven Central

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable annotated release tag, for example v0.3.0-rc.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify, sign, and publish
    runs-on: macos-latest
    timeout-minutes: 180
    if: github.repository == 'Shusek/kotlin-runtime-web-assembly'

    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v0\.3\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          test "$(grep -c '^version=' gradle.properties)" = "1"
          version="$(sed -n 's/^version=//p' gradle.properties)"
          test "$RELEASE_TAG" = "v$version"
          [[ "$version" =~ ^0\.3\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          test -z "$(git status --porcelain)"
          echo "KRWA_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Wasmtime C API
        run: |
          set -euo pipefail
          version="$(grep '^wasmtime = ' gradle/libs.versions.toml | cut -d '"' -f 2)"
          case "$(uname -m)" in
            arm64)
              target="aarch64-macos"
              api_sha256="f2a33c780715cbe740ca888ed3ee38a197d970800ca1b117b338db3aed819333"
              cli_sha256="acee50be70dbe90b0ab2ac7db1321fc44715153a1b1cc58291c97b6d7cffc558"
              ;;
            x86_64)
              target="x86_64-macos"
              api_sha256="c376c153dfd13f281f7f6cf1f9d5ad18b283ab093cf6ae9142612f4f9915f707"
              cli_sha256="0513db67e7089c7e5f743a01427782bc4def83854222f4bc9b1d75f0b925240b"
              ;;
            *) echo "Unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          api_archive="$RUNNER_TEMP/wasmtime-c-api.tar.xz"
          cli_archive="$RUNNER_TEMP/wasmtime-cli.tar.xz"
          root="$RUNNER_TEMP/wasmtime-c-api"
          curl --fail --location --output "$api_archive" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v${version}/wasmtime-v${version}-${target}-c-api.tar.xz"
          curl --fail --location --output "$cli_archive" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v${version}/wasmtime-v${version}-${target}.tar.xz"
          test "$(shasum -a 256 "$api_archive" | cut -d ' ' -f 1)" = "$api_sha256"
          test "$(shasum -a 256 "$cli_archive" | cut -d ' ' -f 1)" = "$cli_sha256"
          mkdir -p "$root"
          tar -xJf "$api_archive" -C "$root"
          tar -xJf "$cli_archive" -C "$root"
          library="$root/wasmtime-v${version}-${target}-c-api/lib/libwasmtime.dylib"
          executable="$root/wasmtime-v${version}-${target}/wasmtime"
          test -f "$library"
          test -x "$executable"
          echo "KRWA_WASMTIME_LIBRARY=$library" >> "$GITHUB_ENV"
          echo "WASMTIME=$executable" >> "$GITHUB_ENV"
          dirname "$executable" >> "$GITHUB_PATH"

      - name: Install wasm-tools CLI
        run: |
          set -euo pipefail
          version="$(grep '^wasmTools = ' gradle/libs.versions.toml | cut -d '"' -f 2)"
          case "$(uname -m)" in
            arm64)
              target="aarch64-macos"
              archive_sha256="c4c0f8560d996e47313aadf8df745e4d15eef38090e671384eafcb06d8d135fa"
              ;;
            x86_64)
              target="x86_64-macos"
              archive_sha256="108759377f47278ec598a994993bf10770d907dd935be5c436ca5cfc01bd008c"
              ;;
            *) echo "Unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/wasm-tools.tar.gz"
          root="$RUNNER_TEMP/wasm-tools"
          curl --fail --location --output "$archive" \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${version}/wasm-tools-${version}-${target}.tar.gz"
          test "$(shasum -a 256 "$archive" | cut -d ' ' -f 1)" = "$archive_sha256"
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root"
          executable="$root/wasm-tools-${version}-${target}/wasm-tools"
          test -x "$executable"
          echo "KRWA_WASM_TOOLS=$executable" >> "$GITHUB_ENV"
          dirname "$executable" >> "$GITHUB_PATH"

      - name: Install and verify pinned native toolchain
        run: |
          set -euo pipefail
          rust_version="$(sed -n 's/^rustRelease = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          rust_commit="$(sed -n 's/^rustReleaseCommit = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          test -n "$rust_version"
          test -n "$rust_commit"
          rustup --version
          rustup toolchain install "$rust_version" --profile minimal
          rustc_metadata="$(rustup run "$rust_version" rustc -vV)"
          test "$(printf '%s\n' "$rustc_metadata" | sed -n 's/^release: //p')" = "$rust_version"
          test "$(printf '%s\n' "$rustc_metadata" | sed -n 's/^commit-hash: //p')" = "$rust_commit"
          cargo "+$rust_version" --version
          cmake --version
          xcrun --sdk iphoneos --find clang++
          xcrun --sdk iphonesimulator --find clang++
          gpg --version

      - name: Create compatible iOS simulator
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes | awk '/^iOS / && $0 !~ /unavailable/ { value=$NF } END { gsub(/[()]/, "", value); print value }')"
          device_id=""
          while IFS= read -r device_type; do
            if device_id="$(xcrun simctl create 'KRWA Maven Central' "$device_type" "$runtime" 2>/dev/null)"; then
              break
            fi
          done < <(xcrun simctl list devicetypes | awk '/^iPhone / { value=$NF; gsub(/[()]/, "", value); print value }')
          test -n "$device_id"
          echo "KRWA_TEST_SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"

      - name: Test build logic
        run: ./gradlew -p buildSrc --no-daemon test
        env:
          GRADLE_OPTS: "-ea"

      - name: Prepare pinned release dependencies
        run: ./gradlew --no-daemon prepareReleaseDependencies
        env:
          GRADLE_OPTS: "-ea"

      - name: Run complete release gate offline
        run: ./gradlew --no-daemon --offline releaseGate
        env:
          GRADLE_OPTS: "-ea"

      - name: Materialize release credentials
        env:
          MAVEN_CENTRAL_USERNAME_VALUE: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD_VALUE: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_SIGNING_KEY_VALUE: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD_VALUE: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          secrets_directory="$RUNNER_TEMP/kendive-maven-central-secrets"
          install -d -m 700 "$secrets_directory"
          printf '%s' "$MAVEN_CENTRAL_USERNAME_VALUE" > "$secrets_directory/username"
          printf '%s' "$MAVEN_CENTRAL_PASSWORD_VALUE" > "$secrets_directory/password"
          printf '%s' "$MAVEN_SIGNING_KEY_VALUE" > "$secrets_directory/signing-key.asc"
          printf '%s' "$MAVEN_SIGNING_PASSWORD_VALUE" > "$secrets_directory/signing-password"
          test -s "$secrets_directory/username"
          test -s "$secrets_directory/password"
          test -s "$secrets_directory/signing-key.asc"
          chmod 600 "$secrets_directory"/*
          echo "MAVEN_SECRET_DIRECTORY=$secrets_directory" >> "$GITHUB_ENV"

      - name: Build signed Maven Central bundle
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/kendive-${KRWA_RELEASE_VERSION}-central.zip"
          python .github/scripts/build_maven_central_bundle.py \
            --repository build/release-staging-repository \
            --version "$KRWA_RELEASE_VERSION" \
            --signing-key-file "$MAVEN_SECRET_DIRECTORY/signing-key.asc" \
            --signing-password-file "$MAVEN_SECRET_DIRECTORY/signing-password" \
            --output "$bundle"
          unzip -t "$bundle"
          mkdir -p build/maven-central-evidence
          shasum -a 256 "$bundle" > build/maven-central-evidence/central-bundle.sha256
          cp build/release-staging-repository/SHA256SUMS \
            build/maven-central-evidence/release-staging-SHA256SUMS
          echo "MAVEN_CENTRAL_BUNDLE=$bundle" >> "$GITHUB_ENV"

      - name: Upload and automatically publish
        run: |
          python .github/scripts/publish_maven_central.py \
            --bundle "$MAVEN_CENTRAL_BUNDLE" \
            --username-file "$MAVEN_SECRET_DIRECTORY/username" \
            --password-file "$MAVEN_SECRET_DIRECTORY/password" \
            --deployment-name "Kendive ${KRWA_RELEASE_VERSION}" \
            --receipt build/maven-central-evidence/publisher-receipt.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload non-secret release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maven-central-evidence-${{ inputs.tag }}
          path: build/maven-central-evidence
          retention-days: 90
          if-no-files-found: warn

      - name: Delete test simulator
        if: always()
        run: |
          if [ -n "${KRWA_TEST_SIMULATOR_ID:-}" ]; then
            xcrun simctl delete "$KRWA_TEST_SIMULATOR_ID" || true
          fi

      - name: Remove release credentials and bundle
        if: always()
        run: |
          if [ -n "${MAVEN_SECRET_DIRECTORY:-}" ]; then
            rm -rf "$MAVEN_SECRET_DIRECTORY"
          fi
          if [ -n "${MAVEN_CENTRAL_BUNDLE:-}" ]; then
            rm -f "$MAVEN_CENTRAL_BUNDLE"
          fi
